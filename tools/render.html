<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;800&family=Geist+Mono:wght@400;500;700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; background: transparent; }
  body { font-family: Geist, system-ui, sans-serif; color: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Drawing for tools/render.cjs. Black and white. Units: metres, x right, z down (as seen from above).
const C = {
  bg: '#ffffff', panel: '#f4f4f4',
  lo: [222, 222, 222], hi: [128, 128, 128], // road: darker = higher
  mark: '#000000',                          // checkpoints, start, finish
  tas: '#000000', human: '#8a8a8a', text: '#000000', dim: '#6b6b6b', rule: '#e2e2e2',
};
const decode = b64 => { const s = atob(b64), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return new Float32Array(u.buffer); };
const mix = (a, b, t) => `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(',')})`;

function bounds(t) {
  const P = [...t.tas, ...(t.human || [])];
  let x0 = Infinity, x1 = -Infinity, z0 = Infinity, z1 = -Infinity;
  for (const [x, , z] of P) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); z0 = Math.min(z0, z); z1 = Math.max(z1, z); }
  const pad = 30;
  return { x0: x0 - pad, x1: x1 + pad, z0: z0 - pad, z1: z1 + pad };
}

// Draw track t into the box (x, y, w, h) of ctx.
function drawMap(ctx, t, x, y, w, h, { line = 2.4 } = {}) {
  const tri = decode(t.tris), b = bounds(t);
  const s = Math.min(w / (b.x1 - b.x0), h / (b.z1 - b.z0));
  const ox = x + (w - (b.x1 - b.x0) * s) / 2 - b.x0 * s, oz = y + (h - (b.z1 - b.z0) * s) / 2 - b.z0 * s;
  const X = v => ox + v * s, Z = v => oz + v * s;
  let ylo = Infinity, yhi = -Infinity;
  for (let i = 6; i < tri.length; i += 9) { ylo = Math.min(ylo, tri[i]); yhi = Math.max(yhi, tri[i]); }
  ctx.save();
  ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  for (let i = 0; i < tri.length; i += 9) {
    const top = tri[i + 6], light = tri[i + 7], kind = tri[i + 8];
    const e = yhi > ylo ? (top - ylo) / (yhi - ylo) : 0.5;
    ctx.fillStyle = kind ? C.mark : mix(C.lo, C.hi, 0.1 + 0.9 * e * (0.6 + 0.4 * light));
    ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = 0.6;
    ctx.beginPath();
    ctx.moveTo(X(tri[i]), Z(tri[i + 1])); ctx.lineTo(X(tri[i + 2]), Z(tri[i + 3])); ctx.lineTo(X(tri[i + 4]), Z(tri[i + 5]));
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  const stroke = P => { ctx.beginPath(); P.forEach(([px, , pz], i) => (i ? ctx.lineTo(X(px), Z(pz)) : ctx.moveTo(X(px), Z(pz)))); ctx.stroke(); };
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  // white halo under both lines so they read on any shade of road
  ctx.strokeStyle = C.bg; ctx.lineWidth = line * 2.6;
  if (t.human) stroke(t.human);
  stroke(t.tas);
  if (t.human) { ctx.strokeStyle = C.human; ctx.lineWidth = line * 0.8; ctx.setLineDash([line * 2.5, line * 2]); stroke(t.human); ctx.setLineDash([]); }
  ctx.strokeStyle = C.tas; ctx.lineWidth = line; stroke(t.tas);
  ctx.restore();
}

const fmt = f => (f / 1000).toFixed(3);
const canvas = (W, H, k) => {
  const cv = document.getElementById('c');
  cv.width = W * k; cv.height = H * k; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  const ctx = cv.getContext('2d'); ctx.scale(k, k);
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  return ctx;
};

// One track for the README / LEADERBOARD.md: map + caption. 1200 x 760.
window.trackCard = t => {
  const W = 1200, H = 760, ctx = canvas(W, H, 2);
  drawMap(ctx, t, 24, 116, W - 48, H - 140, { line: 3 });
  ctx.fillStyle = C.text; ctx.font = '800 38px Geist'; ctx.fillText(t.name, 32, 60);
  ctx.fillStyle = C.dim; ctx.font = '400 16px Geist';
  ctx.fillText(`PolyTrack 0.6.3 · top-down, darker = higher${t.human ? ' · dashed = official #1' : ''}`, 32, 90);
  ctx.textAlign = 'right';
  ctx.fillStyle = C.text; ctx.font = '700 22px "Geist Mono"'; ctx.fillText(`TAS ${fmt(t.tasFrames)}  ${t.tasAuthor}`, W - 32, 52);
  if (t.human) { ctx.fillStyle = C.dim; ctx.font = '500 18px "Geist Mono"'; ctx.fillText(`Official #1 ${fmt(t.humanFrames)}  ${t.humanAuthor}`, W - 32, 84); }
  ctx.textAlign = 'left';
  ctx.fillStyle = C.rule; ctx.fillRect(32, 110, W - 64, 1);
};

// Map only, for the website cards. 900 x 600.
window.mapOnly = t => {
  const ctx = canvas(900, 600, 2);
  drawMap(ctx, t, 12, 12, 876, 576, { line: 4.5 });
};

// Social preview / README banner: 1280 x 640.
window.banner = (tracks, stats) => {
  const W = 1280, H = 640, ctx = canvas(W, H, 2);
  const cols = 6, gx = 470, gy = 28, cw = (W - gx - 28) / cols, ch = (H - 56) / 3;
  tracks.forEach((t, i) => {
    const cx = gx + (i % cols) * cw, cy = gy + Math.floor(i / cols) * ch;
    ctx.fillStyle = C.panel; ctx.beginPath(); ctx.roundRect(cx + 4, cy + 4, cw - 8, ch - 8, 6); ctx.fill();
    drawMap(ctx, t, cx + 8, cy + 8, cw - 16, ch - 30, { line: 1.3 });
    ctx.fillStyle = C.dim; ctx.font = '500 11px Geist'; ctx.fillText(t.name, cx + 12, cy + ch - 13);
    ctx.fillStyle = C.text; ctx.font = '700 11px "Geist Mono"'; ctx.textAlign = 'right'; ctx.fillText(fmt(t.tasFrames), cx + cw - 12, cy + ch - 13); ctx.textAlign = 'left';
  });
  const last = tracks.length, cx = gx + (last % cols) * cw, cy = gy + Math.floor(last / cols) * ch;
  ctx.strokeStyle = '#bdbdbd'; ctx.lineWidth = 1; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.roundRect(cx + 4.5, cy + 4.5, cw - 9, ch - 9, 6); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = C.dim; ctx.font = '500 13px Geist'; ctx.textAlign = 'center'; ctx.fillText('your run?', cx + cw / 2, cy + ch / 2 + 4); ctx.textAlign = 'left';

  ctx.fillStyle = C.dim; ctx.font = '500 14px "Geist Mono"'; ctx.fillText('TOOL-ASSISTED SPEEDRUNS', 48, 150);
  ctx.fillStyle = C.text; ctx.font = '800 72px Geist'; ctx.fillText('PolyTrack', 44, 226); ctx.fillText('TAS', 44, 298);
  ctx.fillStyle = '#3a3a3a'; ctx.font = '400 19px Geist';
  ['All 17 official tracks, replayed frame-exact', 'in the real game engine by CI.', '', 'Beat a time? Open a pull request.'].forEach((l, i) => ctx.fillText(l, 48, 356 + i * 30));
  ctx.fillStyle = C.rule; ctx.fillRect(48, 492, 360, 1);
  ctx.fillStyle = C.text; ctx.font = '500 15px "Geist Mono"'; stats.forEach((l, i) => ctx.fillText(l, 48, 522 + i * 24));
};
</script>
</body>
</html>
